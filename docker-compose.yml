services:
  pit-tv:
    build: .
    container_name: pit-tv
    ports:
      - "3500:3000"
    volumes:
      # Mount your local video files so the catalog can find them
      - ./videos:/app/videos
      # Mount your own catalog.json / shows.json so edits and uploads land on
      # the host and survive a container rebuild. Without this the catalog lives
      # inside the container and is destroyed on rebuild.
      - ./data:/app/data
      # Album art, same reason as ./data. This one is NOT optional: covers/ is
      # gitignored and the Dockerfile never copies it, so /app/covers is an empty
      # directory in the image and every /covers/... request 404s until this is
      # mounted. /api/fetch-covers also writes here, so unmounted it fills the
      # container's own layer and the art is lost on the next rebuild.
      - ./covers:/app/covers
    environment:
      - PORT=3000
      # Mutating routes (/api/sync-shows, /api/catalog, /api/set-show,
      # /api/fetch-covers, /api/upload/*) can rewrite the catalog and the video
      # library, and this file publishes the port to the whole LAN — so the
      # server refuses them without PITTV_TOKEN, which is set in .env next to
      # this file (gitignored; see .env.example). Compose substitutes it here.
      # The browser asks for it once and remembers it in localStorage, so
      # syncing shows.json and fetching album art work from any device.
      # Set PITTV_WRITE=0 for a read-only server on the LAN.
      - PITTV_WRITE=1
      - PITTV_TOKEN=${PITTV_TOKEN:-}
    restart: unless-stopped
