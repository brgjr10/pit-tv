services:
  pit-tv:
    build: .
    container_name: pit-tv
    ports:
      - "3500:3000"
    volumes:
      # Mount your local video files so the catalog can find them
      - ./videos:/app/videos
      # Mount your own catalog.json / shows.json so edits and uploads land on
      # the host and survive a container rebuild. Without this the catalog lives
      # inside the container and is destroyed on rebuild.
      - ./data:/app/data
      # Uncomment to use custom album art:
      # - ./covers:/app/covers
    environment:
      - PORT=3000
      # Mutating routes (/api/sync-shows, /api/catalog, /api/set-show,
      # /api/fetch-covers, /api/upload/*) are OFF here on purpose: compose
      # publishes the port to the whole LAN, and this service can rewrite the
      # catalog and the video library. Set PITTV_WRITE=1 *and* PITTV_TOKEN to
      # re-enable them — the token is required once the server is not loopback.
      - PITTV_WRITE=0
      # - PITTV_WRITE=1
      # - PITTV_TOKEN=change-me
    restart: unless-stopped
