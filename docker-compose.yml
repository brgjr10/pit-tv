services:
  pit-tv:
    build: .
    container_name: pit-tv
    ports:
      - "3500:3000"
    volumes:
      # Mount your local video files so the catalog can find them
      - ./videos:/app/videos
      # Uncomment to serve your own catalog.json / shows.json instead of the demo:
      # - ./data:/app/data
      # Uncomment to use custom album art:
      # - ./covers:/app/covers
    environment:
      - PORT=3000
    restart: unless-stopped
