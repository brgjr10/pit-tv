<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIT TV — offline</title>
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<style>
  /* Inlined rather than linked: the stylesheet is in the shell cache, but this
     page is only reached when the shell cache itself is what failed, so it has
     to stand on its own. */
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0d1117;
    color: #e6edf3;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { padding: 2rem; max-width: 34rem; }
  h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
  p { color: #8b949e; margin: 0 0 1.25rem; }
  a {
    display: inline-block;
    padding: 0.5rem 1rem;
    border: 1px solid #30363d;
    border-radius: 6px;
    background: #161b22;
    color: #58a6ff;
    text-decoration: none;
  }
  a:hover { border-color: #58a6ff; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>
    The PIT TV archive could not be reached and this page is not in the cache.
    Clips you have already browsed need the server — the video files live on it,
    so they cannot be stored offline.
  </p>
  <a href="./">Try again</a>
</main>
</body>
</html>
